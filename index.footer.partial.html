<footer id="contacts" class="footer container">
    <h2>Contact <span class="ui-brand">Us</span></h2>
    <form action="" class="footer__contacts">

        <label for="contact-name" class="visually-hidden">Name</label>
        <input id="contact-name" type="text" name="name" placeholder="name" />

        <label for="contact-email" class="visually-hidden">Email</label>
        <input id="contact-email" type="email" name="email" placeholder="email" />

        <button class="button button-card">Submit</button>
    </form>

</footer>
